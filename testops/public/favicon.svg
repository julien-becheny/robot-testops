<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05bef7"/>
      <stop offset="100%" stop-color="#0582f7"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="64" height="64" rx="14" fill="#1a1a2e"/>
  <!-- Terminal window frame -->
  <rect x="8" y="12" width="48" height="40" rx="4" fill="none" stroke="url(#g4)" stroke-width="2"/>
  <!-- Title bar -->
  <line x1="8" y1="20" x2="56" y2="20" stroke="url(#g4)" stroke-width="1.5" opacity="0.5"/>
  <!-- Window dots -->
  <circle cx="14" cy="16" r="1.5" fill="#ff5f57" opacity="0.8"/>
  <circle cx="20" cy="16" r="1.5" fill="#febc2e" opacity="0.8"/>
  <circle cx="26" cy="16" r="1.5" fill="#28c840" opacity="0.8"/>
  <!-- Prompt chevron > -->
  <path d="M14 28 L22 33 L14 38" fill="none" stroke="#05bef7" stroke-width="2.5" 
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Checkmark as "output" -->
  <path d="M26 33 L31 38 L42 26" fill="none" stroke="#28c840" stroke-width="2.5" 
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Blinking cursor -->
  <rect x="46" y="32" width="2" height="8" rx="0.5" fill="#05bef7" opacity="0.7"/>
</svg>
