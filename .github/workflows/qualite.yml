# Vérifications du dépôt sur une machine GitHub temporaire, détruite en fin de job.
# Aucun déploiement, aucun test navigateur, aucun secret.
name: Qualité

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Contrôles qualité
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # uv installe lui-même la version de Python déclarée par .python-version.
      # Le tag est immuable : cette action ne publie plus de tag majeur (pas de @v10).
      - name: Installer uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Installer Node.js 22.12
        uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: testops/package-lock.json

      # Reproduit strictement uv.lock : mêmes versions qu'un poste à jour, outils qualité inclus.
      - name: Installer les dépendances Python
        run: uv sync --locked

      # Reproduit strictement package-lock.json : ni npm install, ni --legacy-peer-deps.
      - name: Installer les dépendances frontend
        working-directory: testops
        run: npm ci

      # Un seul point d'entrée, identique en local : la CI et le poste ne peuvent pas diverger.
      - name: Contrôles qualité
        run: uv run tools/ci_local.py
